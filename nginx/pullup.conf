# /etc/nginx/sites-available/pullup
# Copier ce fichier sur le VPS et faire un lien symbolique dans sites-enabled

# ══════════════════════════════════════════════════════════════════
# Déploiement actuel : HTTP simple sur IP nue (pas de nom de domaine).
# Let's Encrypt ne délivre pas de certificat pour une IP — dès qu'un
# vrai domaine pointe vers ce serveur, lancez `certbot --nginx -d
# votre-domaine.fr` : il réécrira ce fichier lui-même pour ajouter le
# bloc HTTPS et la redirection 80 → 443 automatiquement.
# ══════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;

    # ── Sécurité ─────────────────────────────────────────────────
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ── Blocage des fichiers/dossiers cachés (.git, .env, etc.) ────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Compression ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── HTML — jamais mis en cache ──────────────────────────────────
    # Sans ça, un téléphone qui a déjà visité la page garde une version
    # figée jusqu'à 24h (immutable), y compris les références aux scripts
    # versionnés (?v=N) : les mises à jour du site n'atteignent jamais son
    # navigateur tant que le cache n'expire pas de lui-même.
    location ~* \.html$ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── Cache fichiers statiques (JS/CSS versionnés via ?v=N, images…) ─
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # ── API — pas de cache ────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        add_header         Cache-Control "no-store";

        # Upload photos (5Mo max)
        client_max_body_size 6M;
    }

    # ── App principale ────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # ── Logs ──────────────────────────────────────────────────────
    access_log /var/log/nginx/pullup.access.log;
    error_log  /var/log/nginx/pullup.error.log;
}
