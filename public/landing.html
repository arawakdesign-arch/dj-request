<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
html,body{width:100%}
body{background:#F3EFE7 url(/images/site/bg-texture.webp?v=2) repeat-y top center/min(1672px,100vw) auto fixed;overflow-x:hidden;font-family:-apple-system,system-ui,sans-serif}
img{max-width:100%;display:block;width:100%;height:auto}
a{display:block;width:100%}
.shots{display:flex;flex-direction:column;align-items:stretch;width:100%}
@media (min-width:900px){.shots{max-width:900px;margin:0 auto}}
.shots > div{width:100%}

/* ── menu trigger (visible, toujours au même endroit) ──────────────── */
.menu-btn{position:fixed;top:14px;right:14px;z-index:60;display:flex;align-items:center;gap:.5rem;padding:.62rem 1.1rem;border-radius:999px;border:2px solid rgba(255,255,255,.85);background:rgba(18,18,18,.92);color:#fff;font-weight:800;font-size:.8rem;font-family:'Inter',sans-serif;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.35);transform:rotate(-2deg);transition:transform .15s}
.menu-btn svg{width:15px;height:15px;flex-shrink:0}
.menu-btn:active{transform:rotate(-2deg) scale(.94)}

/* ── overlay menu (plein écran) ───────────────────────────────────── */
.menu-overlay{position:fixed;inset:0;z-index:70;background:#121016;opacity:0;pointer-events:none;transition:opacity .3s}
.menu-overlay.open{opacity:1;pointer-events:auto}
.menu-panel{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;transform:scale(1.04);transition:transform .4s cubic-bezier(.16,1,.3,1)}
.menu-overlay.open .menu-panel{transform:scale(1)}
.menu-panel::before{content:'';position:fixed;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#6F22FF,#8D2CFF,#FF1C8E);z-index:2}
.menu-panel::after{content:'';position:fixed;inset:0;pointer-events:none;opacity:.55;mix-blend-mode:overlay;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:3px 3px;z-index:0}
.menu-watermark{position:absolute;right:-8vw;bottom:2vh;width:70vw;max-width:420px;opacity:.06;transform:rotate(-8deg);pointer-events:none;z-index:0;filter:brightness(0) invert(1)}
.menu-head{display:flex;align-items:center;justify-content:space-between;padding:1.5rem 1.4rem 1rem;position:relative;z-index:1;flex-shrink:0}
.menu-logo{height:34px;object-fit:contain}
.menu-close{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(255,255,255,.06);color:#fff;font-size:1.1rem;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s}
.menu-close:active{transform:scale(.9);background:rgba(255,255,255,.18)}
.menu-eyebrow{display:inline-flex;align-items:center;gap:.4rem;font-family:'Inter',sans-serif;font-weight:800;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:rgba(111,34,255,.4);border:1.5px solid rgba(185,139,255,.55);padding:.4rem .85rem;border-radius:999px;margin:.5rem 1.4rem 0;position:relative;z-index:1;flex-shrink:0;transform:rotate(-1.5deg);width:fit-content}
.menu-links{display:flex;flex-direction:column;justify-content:center;gap:.2rem;padding:1.6rem 1.4rem;position:relative;z-index:1;flex:1;min-height:0}
.menu-links a{display:flex;align-items:center;gap:1rem;padding:1.05rem 0;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.08);opacity:0;transform:translateY(18px);transition:transform .4s ease,opacity .4s ease}
.menu-overlay.open .menu-links a{opacity:1;transform:translateY(0)}
.menu-links a:nth-child(1){transition-delay:.08s}
.menu-links a:nth-child(2){transition-delay:.14s}
.menu-links a:nth-child(3){transition-delay:.2s}
.menu-links a:nth-child(4){transition-delay:.26s}
.menu-links a:nth-child(5){transition-delay:.32s}
.menu-links a:nth-child(6){transition-delay:.38s}
.menu-links a:active .menu-label{color:#B98BFF}
.menu-num{font-family:'Anton',sans-serif;font-size:1rem;color:#fff;flex-shrink:0;width:2.15rem;height:2.15rem;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6F22FF,#8D2CFF);border-radius:8px;box-shadow:0 4px 12px rgba(111,34,255,.4);transform:rotate(-4deg)}
.menu-links a:nth-child(even) .menu-num{transform:rotate(4deg)}
.menu-label{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(1.8rem,8vw,2.6rem);letter-spacing:.01em;color:#fff;line-height:1.05;transition:color .15s}
.menu-cta-wrap{padding:1.4rem 1.4rem 2rem;position:relative;z-index:1;flex-shrink:0}
.menu-cta{padding:1.1rem;border-radius:14px;border:2px solid rgba(255,255,255,.15);background:linear-gradient(115deg,#6F22FF,#8D2CFF,#FF1C8E);color:#fff;text-align:center;font-weight:700;text-decoration:none;box-shadow:0 12px 26px rgba(111,34,255,.4);font-family:'Inter',sans-serif;display:block}
.menu-sub{font-family:'Inter',sans-serif;font-size:.75rem;color:rgba(255,255,255,.4);text-align:center;margin-top:.9rem}
@media (prefers-reduced-motion:reduce){.menu-links a,.menu-panel{transition:none;opacity:1;transform:none}}

/* ── zones de texte HTML par-dessus les images (traduisibles) ──────── */
.ov-badge{position:absolute;display:flex;align-items:center;justify-content:center;gap:.3rem;font-family:'Inter',sans-serif;font-weight:700;color:#121016;font-size:10px;text-align:center;line-height:1.15;padding:0 .4rem}
.ov-txt{position:absolute;font-family:'Inter',sans-serif;font-weight:600;color:#121016;font-size:1rem;line-height:1.3}
.ov-cta{position:absolute;z-index:2;display:flex;align-items:center;justify-content:center;gap:.4rem;min-height:44px;border-radius:999px;background:linear-gradient(115deg,#6F22FF,#8D2CFF,#FF1C8E);color:#fff;font-family:'Inter',sans-serif;font-weight:700;font-size:1rem;text-decoration:none;box-shadow:0 8px 20px rgba(111,34,255,.4)}

footer{padding:2.5rem 1.5rem;text-align:center;font-size:.72rem;color:#8A8494;line-height:2;background:#121212}
footer a{color:rgba(255,255,255,.6);text-decoration:none;display:inline}
footer a:hover{color:#B98BFF}
</style>
</head>
<body>

<button class="menu-btn" id="menuBtn" aria-label="Menu">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  Menu
</button>

<div class="menu-overlay" id="menuOverlay">

      <img src="/images/LOGO120.png" alt="PULL UP!" class="menu-logo">

    <nav class="menu-links">
      <a href="#hero" data-close><span class="menu-num">1</span><span class="menu-label">Accueil</span></a>

      <a href="#everywhere" data-close><span class="menu-num">5</span><span class="menu-label">Utilisé partout</span></a>
      <a href="#pricing" data-close><span class="menu-num">6</span><span class="menu-label">Tarifs</span></a>
    </nav>
    <div class="menu-cta-wrap">
      <a href="/app" class="menu-cta">Se connecter →</a>
      <div class="menu-sub">🔒 Le DJ garde le contrôle.</div>
    </div>
  </div>
</div>

<div class="shots">
  <div id="hero"><a href="/app" aria-label="Rejoindre — La playlist, c'est vous"><img src="/images/site/v10-hero.webp" width="972" height="1665" alt="Pull up — La playlist, c'est vous. Ils proposent leurs sons. Ils votent. Le DJ fait le reste."></a></div>
  <div id="how"><a href="/app" aria-label="Rejoindre — Comment ça marche"><img src="/images/site/v10-how.webp" width="972" height="1875" alt="Comment ça marche : scanne, vote, pull up."></a></div>
  <div id="dj" style="position:relative"><a href="/app" aria-label="Rejoindre — Espace DJ"><img src="/images/site/v10-dj.webp" width="972" height="1740" alt="Espace DJ : press kit, page DJ, réseaux."></a><a href="/app?intent=dj-register" aria-label="S'inscrire comme DJ" style="position:absolute;left:5.97%;top:27.18%;width:39.92%;height:4.77%;z-index:2"></a></div>
  <div id="orga" style="position:relative"><a href="/app" aria-label="Rejoindre — Espace Organisateur"><img src="/images/site/v10-orga.webp" width="972" height="1820" alt="Espace Organisateur : créer un événement, suivre les votes en direct."></a><a href="/app?intent=create-event" aria-label="Créer mon événement" style="position:absolute;left:5.35%;top:23.68%;width:39.92%;height:4.56%;z-index:2"></a></div>
  <div id="everywhere"><a href="/app" aria-label="Rejoindre — Utilisé partout"><img src="/images/site/v10-everywhere.webp" width="972" height="1650" alt="Utilisé partout : clubs, festivals, mariages, entreprises et plus."></a></div>
  <div id="pricing"><a href="/app" aria-label="Rejoindre — Tarifs"><img src="/images/site/v4-pricing.webp" width="972" height="1750" alt="Une seule formule, gratuite : tout inclus, sans engagement."></a></div>
</div>

<script>
const menuBtn = document.getElementById('menuBtn');
const menuOverlay = document.getElementById('menuOverlay');
const menuClose = document.getElementById('menuClose');
const openMenu = () => { menuOverlay.classList.add('open'); document.body.style.overflow = 'hidden'; };
const closeMenu = () => { menuOverlay.classList.remove('open'); document.body.style.overflow = ''; };
menuBtn.addEventListener('click', openMenu);
menuClose.addEventListener('click', closeMenu);
menuOverlay.addEventListener('click', (e) => { if (e.target === menuOverlay) closeMenu(); });
document.querySelectorAll('[data-close]').forEach(a => a.addEventListener('click', closeMenu));
</script>
</body>
